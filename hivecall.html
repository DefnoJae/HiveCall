<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HiveCall — test</title>
<style>
:root {
  --bg-1: #000000;
  --bg-2: #08090a;
  --bg-3: #101113;
  --bg-4: #191b1e;
  --bg-5: #222429;
  --line: #15171a;
  --line-2: #26292e;
  --tx: #f2f3f5;
  --tx-2: #b5bac1;
  --tx-3: #8b8f97;
  --accent: #5865f2;
  --accent-2: #4752c4;
  --accent-dim: rgba(88, 101, 242, 0.16);
  --green: #23a55a;
  --green-2: #1d8f4c;
  --red: #f23f43;
  --red-2: #d83c3e;
  --yellow: #f0b232;
  --radius: 10px;
  --radius-sm: 7px;
  --font: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg-1);
  color: var(--tx);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; }
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-thumb { background: #141518; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #23252a; }
::-webkit-scrollbar-track { background: transparent; }
.hidden { display: none !important; }

.auth-wrap { position: absolute; inset: 0; display: grid; grid-template-columns: 1.05fr 1fr; overflow: hidden; }
.auth-glow { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
.auth-glow::before, .auth-glow::after { content: ""; position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
.auth-glow::before { width: 620px; height: 620px; left: -160px; top: -180px; background: radial-gradient(circle, #5865f2 0%, transparent 62%); }
.auth-glow::after { width: 520px; height: 520px; right: -140px; bottom: -220px; background: radial-gradient(circle, #7c3aed 0%, #db2777 45%, transparent 70%); }
.auth-brand { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 56px 64px 48px; }
.brand-top { display: flex; align-items: center; gap: 14px; }
.brand-logo { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #6b76ff, #4b52d6); box-shadow: 0 8px 24px rgba(88, 101, 242, .45); }
.brand-name { font-size: 21px; font-weight: 800; letter-spacing: .4px; }
.brand-hero { max-width: 440px; }
.brand-hero h1 { font-size: 44px; font-weight: 800; line-height: 1.12; letter-spacing: -.5px; }
.brand-hero h1 em { font-style: normal; background: linear-gradient(90deg, #8b93ff, #c084fc, #f27294); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.brand-hero p { margin-top: 18px; color: var(--tx-2); font-size: 16px; line-height: 1.6; }
.brand-steps { display: grid; gap: 14px; margin-top: 34px; }
.brand-step { display: flex; gap: 12px; align-items: flex-start; color: var(--tx-2); font-size: 14px; line-height: 1.5; }
.brand-step .num { flex: 0 0 26px; height: 26px; border-radius: 8px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--tx); }
.brand-foot { color: var(--tx-3); font-size: 12px; letter-spacing: .4px; text-transform: uppercase; display: flex; gap: 18px; flex-wrap: wrap; }
.brand-foot b { color: var(--tx-2); font-weight: 600; text-transform: none; letter-spacing: 0; }
.auth-card-wrap { position: relative; z-index: 1; display: grid; place-items: center; padding: 40px; }
.auth-card { width: 420px; max-width: 100%; background: rgba(0,0,0,.82); border: 1px solid var(--line-2); border-radius: 16px; padding: 32px; backdrop-filter: blur(14px); box-shadow: 0 30px 60px rgba(0,0,0,.5); }
.auth-tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg-2); border-radius: 10px; padding: 4px; margin-bottom: 26px; }
.auth-tab { padding: 9px 0; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--tx-3); transition: all .15s; }
.auth-tab.active { background: var(--bg-4); color: var(--tx); box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.auth-card h2 { font-size: 22px; font-weight: 800; }
.auth-card .sub { color: var(--tx-3); font-size: 13px; margin: 6px 0 22px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--tx-2); margin-bottom: 7px; }
.field input, .field select { width: 100%; background: var(--bg-2); border: 1px solid var(--line-2); color: var(--tx); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px; outline: none; transition: border-color .15s; }
.field input:focus { border-color: var(--accent); }
.field .hint { font-size: 12px; color: var(--tx-3); margin-top: 6px; }
.swatch-row { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 26px; height: 26px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; position: relative; }
.swatch.selected { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
.swatch.selected::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 800; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--radius-sm); font-weight: 600; font-size: 14px; padding: 11px 16px; transition: background .15s, transform .05s; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: #fff; width: 100%; }
.btn-primary:hover { background: var(--accent-2); }
.btn-green { background: var(--green); color: #fff; }
.btn-green:hover { background: var(--green-2); }
.btn-ghost { background: var(--bg-4); color: var(--tx); }
.btn-ghost:hover { background: var(--bg-5); }
.btn-danger-soft { background: rgba(242,63,67,.12); color: var(--red); }
.btn-danger-soft:hover { background: rgba(242,63,67,.2); }
.btn-sm { padding: 7px 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.auth-error { background: rgba(242,63,67,.12); border: 1px solid rgba(242,63,67,.3); color: #ff8b8d; padding: 9px 12px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px; display: none; }
.auth-error.show { display: block; }

.home { position: absolute; inset: 0; display: flex; }
.rail { width: 68px; flex: 0 0 68px; background: var(--bg-2); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; overflow-y: auto; }
.rail::-webkit-scrollbar { width: 0; }
.rail-btn { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; position: relative; transition: border-radius .18s, background .18s; }
.rail-btn:hover { border-radius: 16px; }
.rail-btn.active::before { content: ""; position: absolute; left: -10px; width: 4px; height: 28px; border-radius: 4px; background: var(--tx); }
.rail-sep { width: 32px; height: 2px; border-radius: 2px; background: var(--bg-5); margin: 4px 0; }
.rail-home { background: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(88,101,242,.35); }
.rail-home:hover { background: var(--accent-2); }
.guild-icon { width: 48px; height: 48px; color: #fff; font-weight: 700; font-size: 15px; letter-spacing: .3px; border-radius: 50%; display: grid; place-items: center; overflow: hidden; transition: border-radius .18s; position: relative; }
.guild-icon:hover { border-radius: 16px; }
.guild-icon.active { border-radius: 16px; }
.guild-icon.active::before { content: ""; position: absolute; left: -10px; width: 4px; height: 28px; border-radius: 4px; background: var(--tx); }
.rail-add { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-4); color: var(--green); transition: all .18s; }
.rail-add:hover { background: var(--green); color: #fff; border-radius: 16px; }
.rail-spacer { flex: 1; }
.rail-me { width: 34px; height: 34px; border-radius: 50%; cursor: pointer; border: none; overflow: hidden; }

.avatar { border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; overflow: hidden; flex: 0 0 auto; user-select: none; }
.avatar.me { box-shadow: 0 0 0 2px var(--bg-1), 0 0 0 4px var(--accent); }

.sidebar { width: 232px; flex: 0 0 232px; background: var(--bg-3); display: flex; flex-direction: column; overflow: hidden; }
.sidebar-head { padding: 0 14px; height: 48px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); position: relative; }
.sidebar-head .gname { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head-drop-btn { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--tx-2); }
.head-drop-btn:hover { background: var(--bg-4); color: var(--tx); }
.dropdown { position: absolute; top: 52px; right: 8px; background: var(--bg-1); border: 1px solid var(--line-2); border-radius: 10px; padding: 6px; min-width: 200px; box-shadow: 0 12px 30px rgba(0,0,0,.5); z-index: 50; }
.dropdown button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 7px; font-size: 14px; color: var(--tx-2); text-align: left; }
.dropdown button:hover { background: var(--accent); color: #fff; }
.dropdown .danger { color: var(--red); }
.dropdown .danger:hover { background: var(--red); color: #fff; }
.dropdown .label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--tx-3); padding: 8px 10px 4px; }

.sidebar-scroll { flex: 1; overflow-y: auto; padding: 18px 10px; }
.channel-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: var(--tx-3); padding: 0 6px 8px; display: flex; justify-content: space-between; align-items: center; }
.channel { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 7px; color: var(--tx-3); font-size: 14px; cursor: pointer; margin-bottom: 2px; }
.channel svg { flex: 0 0 auto; }
.channel:hover { background: var(--bg-4); color: var(--tx-2); }
.channel.active { background: var(--bg-5); color: var(--tx); }
.channel .count { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--tx-3); }
.channel.voice.active .count, .channel.voice:not(.active):hover .count { color: var(--tx); }
.channel .livectl { display: inline-flex; align-items: center; gap: 5px; }

.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulseDot 2s infinite; }
@keyframes pulseDot { 0%,100% { box-shadow: 0 0 0 0 rgba(35,165,90,.6);} 50% { box-shadow: 0 0 0 5px rgba(35,165,90,0);} }

.sidebar-section { margin-top: 22px; }
.sidebar-section .channel-label { color: var(--tx-3); }

.content { flex: 1; background: var(--bg-2); display: flex; min-width: 0; }
.main-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.members-panel { width: 230px; flex: 0 0 230px; background: var(--bg-3); border-left: 1px solid var(--line); overflow-y: auto; padding: 18px 12px; }
.members-group { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: var(--tx-3); padding: 10px 6px 8px; }
.member-row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 7px; cursor: default; }
.member-row:hover { background: var(--bg-4); }
.member-row .a-wrap { position: relative; }
.member-row .status-dot { position: absolute; bottom: -1px; right: -1px; width: 11px; height: 11px; border-radius: 50%; background: var(--green); border: 2.5px solid var(--bg-3); }
.member-row .mname { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.member-row .mtag { color: var(--tx-3); font-size: 12px; }
.member-row .in-call-badge { margin-left: auto; color: var(--green); display: grid; place-items: center; }
.ill-hint { color: var(--tx-3); font-size: 13px; line-height: 1.55; }

.chat-head { height: 48px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 16px; font-size: 15px; font-weight: 700; color: var(--tx-2); }
.chat-head svg { color: var(--tx-3); }
.chat-msgs { flex: 1; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 2px; }
.msg { display: flex; gap: 12px; padding: 7px 8px; border-radius: 8px; }
.msg:hover { background: var(--bg-3); }
.msg .m-body { min-width: 0; }
.msg .m-meta { display: flex; align-items: baseline; gap: 8px; }
.msg .m-name { font-weight: 700; font-size: 14px; }
.msg .m-time { font-size: 11px; color: var(--tx-3); }
.msg .m-text { color: var(--tx-2); font-size: 14.5px; line-height: 1.45; margin-top: 1px; overflow-wrap: anywhere; }
.msg.system { background: var(--bg-3); border-radius: 8px; align-items: center; }
.msg.system .m-text { color: var(--tx-3); font-size: 13px; }
.msg.system .sicon { color: var(--accent); }
.chat-comp { padding: 14px 16px 18px; }
.chat-comp .inner { background: var(--bg-4); border-radius: 10px; display: flex; align-items: center; padding: 0 8px; }
.chat-comp input { flex: 1; background: none; border: none; outline: none; color: var(--tx); font-size: 14.5px; padding: 12px 8px; }
.chat-comp .send { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: var(--tx-3); }
.chat-comp .send:hover { color: var(--tx); background: var(--bg-5); }

.voice-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px; overflow-y: auto; }
.voice-card { width: 560px; max-width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; }
.voice-hero { width: 96px; height: 96px; border-radius: 26px; display: grid; place-items: center; margin-bottom: 22px; box-shadow: 0 18px 40px rgba(0,0,0,.45); }
.voice-hero.live { background: linear-gradient(135deg, #23a55a, #14803f); color: #fff; animation: heroPulse 2.6s infinite; }
.voice-hero.idle { background: var(--bg-4); color: var(--tx-3); }
@keyframes heroPulse { 0%,100% { box-shadow: 0 18px 40px rgba(35,165,90,.5);} 50% { box-shadow: 0 18px 55px rgba(35,165,90,.9);} }
.voice-card h1 { font-size: 26px; font-weight: 800; }
.voice-card .vsub { color: var(--tx-3); font-size: 14px; margin-top: 10px; line-height: 1.55; max-width: 420px; }
.voice-status { display: flex; align-items: center; gap: 8px; margin-top: 14px; color: var(--tx-2); font-size: 14px; background: var(--bg-3); border-radius: 999px; padding: 7px 16px; }
.voice-people { display: flex; align-items: center; margin-top: 26px; flex-wrap: wrap; justify-content: center; gap: 0; }
.chip { display: flex; align-items: center; gap: 8px; background: var(--bg-3); border: 1px solid var(--line-2); border-radius: 999px; padding: 5px 12px 5px 6px; font-size: 13.5px; font-weight: 600; margin: 0 4px 8px; }
.chip .speak { color: var(--yellow); display: grid; place-items: center; }
.chip.empty { color: var(--tx-3); font-weight: 500; border-style: dashed; }
.voice-actions { display: flex; gap: 12px; margin-top: 30px; align-items: center; }
.voice-actions .btn { padding: 13px 22px; font-size: 15px; border-radius: 10px; }
.voice-note { color: var(--tx-3); font-size: 12px; margin-top: 22px; display: flex; gap: 6px; align-items: center; }

.empty-wrap { flex: 1; display: grid; place-items: center; padding: 32px; }
.empty-card { text-align: center; max-width: 430px; }
.empty-card .e-icon { width: 88px; height: 88px; margin: 0 auto 20px; border-radius: 24px; background: var(--bg-4); display: grid; place-items: center; color: var(--tx-2); }
.empty-card h2 { font-size: 24px; font-weight: 800; }
.empty-card p { color: var(--tx-2); font-size: 14.5px; line-height: 1.6; margin-top: 10px; }
.empty-card .btn { margin-top: 24px; }

.call { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; background: radial-gradient(1200px 800px at 82% -10%, rgba(124,58,237,.20), transparent 60%), radial-gradient(1000px 700px at 0% 110%, rgba(88,101,242,.16), transparent 60%), linear-gradient(180deg, #050506, #000000); }
.call::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(900px 420px at 50% 100%, rgba(0,0,0,.34), transparent 70%); }
.call-top { height: 56px; flex: 0 0 56px; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
.call-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.call-left .sname { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.call-left .cname { color: var(--tx-3); font-size: 13px; white-space: nowrap; }
.pi-tag { display: inline-flex; align-items: center; gap: 7px; background: var(--bg-4); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 700; color: var(--tx-2); }
.pi-tag.live { background: rgba(35,165,90,.16); color: #52e394; }
.call-right { display: flex; align-items: center; gap: 10px; }
.call-right .btn-ghost { padding: 7px 12px; border-radius: 8px; display: inline-flex; align-items: center; gap: 7px; font-size: 13px; }

.call-stage { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 0; position: relative; z-index: 1; }
.stage-main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
.stage-main.share { background: #000000; padding: 14px 20px; }
.stage-main.share .share-tile { width: 100%; height: 100%; max-width: 100%; max-height: 100%; margin: 0; box-shadow: 0 18px 60px rgba(0,0,0,.55); }
.stage-main.share .share-tile video { object-fit: contain; background: #040506; }
.stage-strip { flex: 0 0 auto; display: flex; gap: 10px; align-items: center; justify-content: center; overflow-x: auto; padding: 10px 14px 88px; min-height: 0; }
.stage-strip[hidden] { display: none; }
.stage-strip .tile { flex: 0 0 auto; width: 176px; aspect-ratio: 16 / 9; border-radius: 10px; box-shadow: 0 10px 28px rgba(0,0,0,.45); }
.tiles { width: 100%; height: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); grid-auto-rows: 1fr; gap: 12px; align-content: stretch; justify-content: stretch; min-height: 0; }
.tile { position: relative; min-height: 0; border-radius: 14px; overflow: hidden; background: var(--bg-3); border: 1px solid rgba(255,255,255,.06); box-shadow: 0 12px 40px rgba(0,0,0,.45); }
.tile.share-tile { grid-column: 1 / -1; }
.tile.speaking { border-color: var(--yellow); box-shadow: 0 0 0 2px rgba(240,178,50,.5), 0 0 24px rgba(240,178,50,.25); }
.tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile .tile-fill { position: absolute; inset: 0; display: grid; place-items: center; }
.tile .tile-avatar { width: 54%; max-width: 120px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: clamp(18px, 3vw, 30px); }
.tile.pres .tile-fill { background: repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 14px, rgba(255,255,255,0) 14px 28px), linear-gradient(160deg, #131417, #050506); }
.tile.pres .pres-art { display: flex; gap: 8px; align-items: flex-end; height: 40px; justify-content: center; }
.tile.pres .pres-art i { width: 10px; border-radius: 4px; background: var(--accent); display: block; animation: bars 1.1s ease-in-out infinite; }
.tile.pres .pres-art i:nth-child(2){ background:#7c3aed; animation-delay:.12s;} 
.tile.pres .pres-art i:nth-child(3){ background:#c084fc; animation-delay:.24s;} 
.tile.pres .pres-art i:nth-child(4){ background:#ec4899; animation-delay:.36s;} 
@keyframes bars { 0%,100% { height: 12px; } 50% { height: 34px; } }
.tile .tile-tag { position: absolute; left: 10px; bottom: 10px; display: flex; align-items: center; gap: 7px; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); padding: 5px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 700; z-index: 3; }
.tile .tile-tag .mic-badge { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; }
.mic-badge.on { background: rgba(35,165,90,.35); color: #7cf0b0; }
.mic-badge.off { background: rgba(242,63,67,.5); color: #ffb5b6; }
.tile .busy-cam { position: absolute; right: 10px; bottom: 10px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,.6); display: grid; place-items: center; color: var(--tx-2); z-index: 3; }
.tile .sharing-badge { position: absolute; right: 5px; top: 5px; background: var(--green); color: #fff; font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; padding: 4px 9px; border-radius: 999px; z-index: 3; }
.tile .tile-camoff { position: absolute; right: 8px; top: 8px; width: 28px; height: 28px; border-radius: 8px; background: rgba(0,0,0,.55); display: grid; place-items: center; color: var(--red); z-index: 3; }
.tile .tile-avatar { position: relative; }
.tile.talking .tile-avatar { animation: talkRingGlow .6s ease-in-out infinite; }
.tile.talking .tile-avatar::before {
  content: ""; position: absolute; inset: -5px; border-radius: 50%;
  background: conic-gradient(from 0deg, transparent 0deg, rgba(35, 165, 90, 1) 120deg, transparent 220deg);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
  animation: talkRingSpin .9s linear infinite;
  opacity: calc(.45 + .55 * var(--talk-int, .5));
  z-index: 3; pointer-events: none;
}
