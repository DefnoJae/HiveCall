<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HiveCall — test</title>
<style>
:root {
  --bg-1: #000000;
  --bg-2: #08090a;
  --bg-3: #101113;
  --bg-4: #191b1e;
  --bg-5: #222429;
  --line: #15171a;
  --line-2: #26292e;
  --tx: #f2f3f5;
  --tx-2: #b5bac1;
  --tx-3: #8b8f97;
  --accent: #5865f2;
  --accent-2: #4752c4;
  --accent-dim: rgba(88, 101, 242, 0.16);
  --green: #23a55a;
  --green-2: #1d8f4c;
  --red: #f23f43;
  --red-2: #d83c3e;
  --yellow: #f0b232;
  --radius: 10px;
  --radius-sm: 7px;
  --font: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg-1);
  color: var(--tx);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; }
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-thumb { background: #141518; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #23252a; }
::-webkit-scrollbar-track { background: transparent; }
.hidden { display: none !important; }

.auth-wrap { position: absolute; inset: 0; display: grid; grid-template-columns: 1.05fr 1fr; overflow: hidden; }
.auth-glow { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
.auth-glow::before, .auth-glow::after { content: ""; position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
.auth-glow::before { width: 620px; height: 620px; left: -160px; top: -180px; background: radial-gradient(circle, #5865f2 0%, transparent 62%); }
.auth-glow::after { width: 520px; height: 520px; right: -140px; bottom: -220px; background: radial-gradient(circle, #7c3aed 0%, #db2777 45%, transparent 70%); }
.auth-brand { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 56px 64px 48px; }
.brand-top { display: flex; align-items: center; gap: 14px; }
.brand-logo { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #6b76ff, #4b52d6); box-shadow: 0 8px 24px rgba(88, 101, 242, .45); }
.brand-name { font-size: 21px; font-weight: 800; letter-spacing: .4px; }
.brand-hero { max-width: 440px; }
.brand-hero h1 { font-size: 44px; font-weight: 800; line-height: 1.12; letter-spacing: -.5px; }
.brand-hero h1 em { font-style: normal; background: linear-gradient(90deg, #8b93ff, #c084fc, #f27294); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.brand-hero p { margin-top: 18px; color: var(--tx-2); font-size: 16px; line-height: 1.6; }
.brand-steps { display: grid; gap: 14px; margin-top: 34px; }
.brand-step { display: flex; gap: 12px; align-items: flex-start; color: var(--tx-2); font-size: 14px; line-height: 1.5; }
.brand-step .num { flex: 0 0 26px; height: 26px; border-radius: 8px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--tx); }
.brand-foot { color: var(--tx-3); font-size: 12px; letter-spacing: .4px; text-transform: uppercase; display: flex; gap: 18px; flex-wrap: wrap; }
.brand-foot b { color: var(--tx-2); font-weight: 600; text-transform: none; letter-spacing: 0; }
.auth-card-wrap { position: relative; z-index: 1; display: grid; place-items: center; padding: 40px; }
.auth-card { width: 420px; max-width: 100%; background: rgba(0,0,0,.82); border: 1px solid var(--line-2); border-radius: 16px; padding: 32px; backdrop-filter: blur(14px); box-shadow: 0 30px 60px rgba(0,0,0,.5); }
.auth-tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg-2); border-radius: 10px; padding: 4px; margin-bottom: 26px; }
.auth-tab { padding: 9px 0; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--tx-3); transition: all .15s; }
.auth-tab.active { background: var(--bg-4); color: var(--tx); box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.auth-card h2 { font-size: 22px; font-weight: 800; }
.auth-card .sub { color: var(--tx-3); font-size: 13px; margin: 6px 0 22px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--tx-2); margin-bottom: 7px; }
.field input, .field select { width: 100%; background: var(--bg-2); border: 1px solid var(--line-2); color: var(--tx); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px; outline: none; transition: border-color .15s; }
.field input:focus { border-color: var(--accent); }
.field .hint { font-size: 12px; color: var(--tx-3); margin-top: 6px; }
.swatch-row { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 26px; height: 26px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; position: relative; }
.swatch.selected { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
.swatch.selected::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 800; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--radius-sm); font-weight: 600; font-size: 14px; padding: 11px 16px; transition: background .15s, transform .05s; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: #fff; width: 100%; }
.btn-primary:hover { background: var(--accent-2); }
.btn-green { background: var(--green); color: #fff; }
.btn-green:hover { background: var(--green-2); }
.btn-ghost { background: var(--bg-4); color: var(--tx); }
.btn-ghost:hover { background: var(--bg-5); }
.btn-danger-soft { background: rgba(242,63,67,.12); color: var(--red); }
.btn-danger-soft:hover { background: rgba(242,63,67,.2); }
.btn-sm { padding: 7px 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.auth-error { background: rgba(242,63,67,.12); border: 1px solid rgba(242,63,67,.3); color: #ff8b8d; padding: 9px 12px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px; display: none; }
.auth-error.show { display: block; }

.home { position: absolute; inset: 0; display: flex; }
.rail { width: 68px; flex: 0 0 68px; background: var(--bg-2); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; overflow-y: auto; }
.rail::-webkit-scrollbar { width: 0; }
.rail-btn { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; position: relative; transition: border-radius .18s, background .18s; }
.rail-btn:hover { border-radius: 16px; }
.rail-btn.active::before { content: ""; position: absolute; left: -10px; width: 4px; height: 28px; border-radius: 4px; background: var(--tx); }
.rail-sep { width: 32px; height: 2px; border-radius: 2px; background: var(--bg-5); margin: 4px 0; }
.rail-home { background: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(88,101,242,.35); }
.rail-home:hover { background: var(--accent-2); }
.guild-icon { width: 48px; height: 48px; color: #fff; font-weight: 700; font-size: 15px; letter-spacing: .3px; border-radius: 50%; display: grid; place-items: center; overflow: hidden; transition: border-radius .18s; position: relative; }
.guild-icon:hover { border-radius: 16px; }
.guild-icon.active { border-radius: 16px; }
.guild-icon.active::before { content: ""; position: absolute; left: -10px; width: 4px; height: 28px; border-radius: 4px; background: var(--tx); }
.rail-add { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-4); color: var(--green); transition: all .18s; }
.rail-add:hover { background: var(--green); color: #fff; border-radius: 16px; }
.rail-spacer { flex: 1; }
.rail-me { width: 34px; height: 34px; border-radius: 50%; cursor: pointer; border: none; overflow: hidden; }

.avatar { border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; overflow: hidden; flex: 0 0 auto; user-select: none; }
.avatar.me { box-shadow: 0 0 0 2px var(--bg-1), 0 0 0 4px var(--accent); }

.sidebar { width: 232px; flex: 0 0 232px; background: var(--bg-3); display: flex; flex-direction: column; overflow: hidden; }
.sidebar-head { padding: 0 14px; height: 48px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); position: relative; }
.sidebar-head .gname { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head-drop-btn { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--tx-2); }
.head-drop-btn:hover { background: var(--bg-4); color: var(--tx); }
.dropdown { position: absolute; top: 52px; right: 8px; background: var(--bg-1); border: 1px solid var(--line-2); border-radius: 10px; padding: 6px; min-width: 200px; box-shadow: 0 12px 30px rgba(0,0,0,.5); z-index: 50; }
.dropdown button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 7px; font-size: 14px; color: var(--tx-2); text-align: left; }
.dropdown button:hover { background: var(--accent); color: #fff; }
.dropdown .danger { color: var(--red); }
.dropdown .danger:hover { background: var(--red); color: #fff; }
.dropdown .label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--tx-3); padding: 8px 10px 4px; }

.sidebar-scroll { flex: 1; overflow-y: auto; padding: 18px 10px; }
.channel-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: var(--tx-3); padding: 0 6px 8px; display: flex; justify-content: space-between; align-items: center; }
.channel { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 7px; color: var(--tx-3); font-size: 14px; cursor: pointer; margin-bottom: 2px; }
.channel svg { flex: 0 0 auto; }
.channel:hover { background: var(--bg-4); color: var(--tx-2); }
.channel.active { background: var(--bg-5); color: var(--tx); }
.channel .count { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--tx-3); }
.channel.voice.active .count, .channel.voice:not(.active):hover .count { color: var(--tx); }
.channel .livectl { display: inline-flex; align-items: center; gap: 5px; }

.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulseDot 2s infinite; }
@keyframes pulseDot { 0%,100% { box-shadow: 0 0 0 0 rgba(35,165,90,.6);} 50% { box-shadow: 0 0 0 5px rgba(35,165,90,0);} }

.sidebar-section { margin-top: 22px; }
.sidebar-section .channel-label { color: var(--tx-3); }

.content { flex: 1; background: var(--bg-2); display: flex; min-width: 0; }
.main-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.members-panel { width: 230px; flex: 0 0 230px; background: var(--bg-3); border-left: 1px solid var(--line); overflow-y: auto; padding: 18px 12px; }
.members-group { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: var(--tx-3); padding: 10px 6px 8px; }
.member-row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 7px; cursor: default; }
.member-row:hover { background: var(--bg-4); }
.member-row .a-wrap { position: relative; }
.member-row .status-dot { position: absolute; bottom: -1px; right: -1px; width: 11px; height: 11px; border-radius: 50%; background: var(--green); border: 2.5px solid var(--bg-3); }
.member-row .mname { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.member-row .mtag { color: var(--tx-3); font-size: 12px; }
.member-row .in-call-badge { margin-left: auto; color: var(--green); display: grid; place-items: center; }
.ill-hint { color: var(--tx-3); font-size: 13px; line-height: 1.55; }

.chat-head { height: 48px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 16px; font-size: 15px; font-weight: 700; color: var(--tx-2); }
.chat-head svg { color: var(--tx-3); }
.chat-msgs { flex: 1; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 2px; }
.msg { display: flex; gap: 12px; padding: 7px 8px; border-radius: 8px; }
.msg:hover { background: var(--bg-3); }
.msg .m-body { min-width: 0; }
.msg .m-meta { display: flex; align-items: baseline; gap: 8px; }
.msg .m-name { font-weight: 700; font-size: 14px; }
.msg .m-time { font-size: 11px; color: var(--tx-3); }
.msg .m-text { color: var(--tx-2); font-size: 14.5px; line-height: 1.45; margin-top: 1px; overflow-wrap: anywhere; }
.msg.system { background: var(--bg-3); border-radius: 8px; align-items: center; }
.msg.system .m-text { color: var(--tx-3); font-size: 13px; }
.msg.system .sicon { color: var(--accent); }
.chat-comp { padding: 14px 16px 18px; }
.chat-comp .inner { background: var(--bg-4); border-radius: 10px; display: flex; align-items: center; padding: 0 8px; }
.chat-comp input { flex: 1; background: none; border: none; outline: none; color: var(--tx); font-size: 14.5px; padding: 12px 8px; }
.chat-comp .send { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: var(--tx-3); }
.chat-comp .send:hover { color: var(--tx); background: var(--bg-5); }

.voice-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px; overflow-y: auto; }
.voice-card { width: 560px; max-width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; }
.voice-hero { width: 96px; height: 96px; border-radius: 26px; display: grid; place-items: center; margin-bottom: 22px; box-shadow: 0 18px 40px rgba(0,0,0,.45); }
.voice-hero.live { background: linear-gradient(135deg, #23a55a, #14803f); color: #fff; animation: heroPulse 2.6s infinite; }
.voice-hero.idle { background: var(--bg-4); color: var(--tx-3); }
@keyframes heroPulse { 0%,100% { box-shadow: 0 18px 40px rgba(35,165,90,.5);} 50% { box-shadow: 0 18px 55px rgba(35,165,90,.9);} }
.voice-card h1 { font-size: 26px; font-weight: 800; }
.voice-card .vsub { color: var(--tx-3); font-size: 14px; margin-top: 10px; line-height: 1.55; max-width: 420px; }
.voice-status { display: flex; align-items: center; gap: 8px; margin-top: 14px; color: var(--tx-2); font-size: 14px; background: var(--bg-3); border-radius: 999px; padding: 7px 16px; }
.voice-people { display: flex; align-items: center; margin-top: 26px; flex-wrap: wrap; justify-content: center; gap: 0; }
.chip { display: flex; align-items: center; gap: 8px; background: var(--bg-3); border: 1px solid var(--line-2); border-radius: 999px; padding: 5px 12px 5px 6px; font-size: 13.5px; font-weight: 600; margin: 0 4px 8px; }
.chip .speak { color: var(--yellow); display: grid; place-items: center; }
.chip.empty { color: var(--tx-3); font-weight: 500; border-style: dashed; }
.voice-actions { display: flex; gap: 12px; margin-top: 30px; align-items: center; }
.voice-actions .btn { padding: 13px 22px; font-size: 15px; border-radius: 10px; }
.voice-note { color: var(--tx-3); font-size: 12px; margin-top: 22px; display: flex; gap: 6px; align-items: center; }

.empty-wrap { flex: 1; display: grid; place-items: center; padding: 32px; }
.empty-card { text-align: center; max-width: 430px; }
.empty-card .e-icon { width: 88px; height: 88px; margin: 0 auto 20px; border-radius: 24px; background: var(--bg-4); display: grid; place-items: center; color: var(--tx-2); }
.empty-card h2 { font-size: 24px; font-weight: 800; }
.empty-card p { color: var(--tx-2); font-size: 14.5px; line-height: 1.6; margin-top: 10px; }
.empty-card .btn { margin-top: 24px; }

.call { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; background: radial-gradient(1200px 800px at 82% -10%, rgba(124,58,237,.20), transparent 60%), radial-gradient(1000px 700px at 0% 110%, rgba(88,101,242,.16), transparent 60%), linear-gradient(180deg, #050506, #000000); }
.call::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(900px 420px at 50% 100%, rgba(0,0,0,.34), transparent 70%); }
.call-top { height: 56px; flex: 0 0 56px; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
.call-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.call-left .sname { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.call-left .cname { color: var(--tx-3); font-size: 13px; white-space: nowrap; }
.pi-tag { display: inline-flex; align-items: center; gap: 7px; background: var(--bg-4); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 700; color: var(--tx-2); }
.pi-tag.live { background: rgba(35,165,90,.16); color: #52e394; }
.call-right { display: flex; align-items: center; gap: 10px; }
.call-right .btn-ghost { padding: 7px 12px; border-radius: 8px; display: inline-flex; align-items: center; gap: 7px; font-size: 13px; }

.call-stage { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 0; position: relative; z-index: 1; }
.stage-main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
.stage-main.share { background: #000000; padding: 14px 20px; }
.stage-main.share .share-tile { width: 100%; height: 100%; max-width: 100%; max-height: 100%; margin: 0; box-shadow: 0 18px 60px rgba(0,0,0,.55); }
.stage-main.share .share-tile video { object-fit: contain; background: #040506; }
.stage-strip { flex: 0 0 auto; display: flex; gap: 10px; align-items: center; justify-content: center; overflow-x: auto; padding: 10px 14px 88px; min-height: 0; }
.stage-strip[hidden] { display: none; }
.stage-strip .tile { flex: 0 0 auto; width: 176px; aspect-ratio: 16 / 9; border-radius: 10px; box-shadow: 0 10px 28px rgba(0,0,0,.45); }
.tiles { width: 100%; height: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); grid-auto-rows: 1fr; gap: 12px; align-content: stretch; justify-content: stretch; min-height: 0; }
.tile { position: relative; min-height: 0; border-radius: 14px; overflow: hidden; background: var(--bg-3); border: 1px solid rgba(255,255,255,.06); box-shadow: 0 12px 40px rgba(0,0,0,.45); }
.tile.share-tile { grid-column: 1 / -1; }
.tile.speaking { border-color: var(--yellow); box-shadow: 0 0 0 2px rgba(240,178,50,.5), 0 0 24px rgba(240,178,50,.25); }
.tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile .tile-fill { position: absolute; inset: 0; display: grid; place-items: center; }
.tile .tile-avatar { width: 54%; max-width: 120px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: clamp(18px, 3vw, 30px); }
.tile.pres .tile-fill { background: repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 14px, rgba(255,255,255,0) 14px 28px), linear-gradient(160deg, #131417, #050506); }
.tile.pres .pres-art { display: flex; gap: 8px; align-items: flex-end; height: 40px; justify-content: center; }
.tile.pres .pres-art i { width: 10px; border-radius: 4px; background: var(--accent); display: block; animation: bars 1.1s ease-in-out infinite; }
.tile.pres .pres-art i:nth-child(2){ background:#7c3aed; animation-delay:.12s;} 
.tile.pres .pres-art i:nth-child(3){ background:#c084fc; animation-delay:.24s;} 
.tile.pres .pres-art i:nth-child(4){ background:#ec4899; animation-delay:.36s;} 
@keyframes bars { 0%,100% { height: 12px; } 50% { height: 34px; } }
.tile .tile-tag { position: absolute; left: 10px; bottom: 10px; display: flex; align-items: center; gap: 7px; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); padding: 5px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 700; z-index: 3; }
.tile .tile-tag .mic-badge { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; }
.mic-badge.on { background: rgba(35,165,90,.35); color: #7cf0b0; }
.mic-badge.off { background: rgba(242,63,67,.5); color: #ffb5b6; }
.tile .busy-cam { position: absolute; right: 10px; bottom: 10px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,.6); display: grid; place-items: center; color: var(--tx-2); z-index: 3; }
.tile .sharing-badge { position: absolute; right: 5px; top: 5px; background: var(--green); color: #fff; font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; padding: 4px 9px; border-radius: 999px; z-index: 3; }
.tile .tile-camoff { position: absolute; right: 8px; top: 8px; width: 28px; height: 28px; border-radius: 8px; background: rgba(0,0,0,.55); display: grid; place-items: center; color: var(--red); z-index: 3; }
.tile .tile-avatar { position: relative; }
.tile.talking .tile-avatar { animation: talkRingGlow .6s ease-in-out infinite; }
.tile.talking .tile-avatar::before {
  content: ""; position: absolute; inset: -5px; border-radius: 50%;
  background: conic-gradient(from 0deg, transparent 0deg, rgba(35, 165, 90, 1) 120deg, transparent 220deg);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
  animation: talkRingSpin .9s linear infinite;
  opacity: calc(.45 + .55 * var(--talk-int, .5));
  z-index: 3; pointer-events: none;
}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="root-modal"></div>
  <div id="toasts"></div>
  <div id="yt-host"></div>

<script>
(() => {
  "use strict";

  /* ======================= tiny helpers ======================= */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const byId = id => document.getElementById(id);
  const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = arr => arr[rand(0, arr.length - 1)];
  const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const initials = n => n.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
  const shortName = n => n.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
  const time12 = t => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const fmtDur = ms => { const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
  const djb2 = s => { let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return "h" + (h >>> 0).toString(36); };

  /* ======================= Supabase + PeerJS setup ======================= */
  /* Required (already provisioned, per the agreed schema):
       servers(id, name, owner_id, invite_code)
       server_members(server_id, user_id)  — composite PK (server_id, user_id)
       messages(id, server_id, user_id, user_name, user_color, content, created_at)
       call_presence(server_id, active_users jsonb)  — one row per server; keeps the roster + "_music"
       soundboard(id, server_id, user_id, name, emoji, data_url, created_at)
     Display names/colors come from auth.users user_metadata (display_name, color)
     and from the user_name/user_color columns on messages + call_presence roster.
     Real-time must be enabled for: messages, call_presence, soundboard (+ broadcast).
     Realtime channel "hc-<server_id>" uses broadcasts: sb_play, kick, invite.
     RLS with the anon key must allow the row ops the app performs. */
  const SUPABASE_URL = "https://xheyslqfzvidoaczlmxz.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoZXlzbHFmenZpZG9hY3psbXh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTIwNTQsImV4cCI6MjEwNDkyODA1NH0.1r1B2H0_51wTDxoaj8v4XF8SYZTsSoiDj42i94hPVyg";
  const supabaseClient = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  /* Optimistic runtime mirrors — filled from Supabase by refreshData().
     guilds() = servers keyed by id (with .members/.call/.chat mirrors),
     users()  = profiles (name/color) keyed by Supabase user id. */
  let DB = { servers: {}, profiles: {}, soundboards: {} };
  const guilds = () => DB.servers;
  const users = () => DB.profiles;
  const saveGuilds = ob => { DB.servers = ob || DB.servers; };
  const saveUsers = ob => { DB.profiles = ob || DB.profiles; };

  /* Device-local prefs ONLY (resolution caches, api keys, settings).
     No accounts, servers, messages, or calls live in localStorage any more. */
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const prefs = () => lsGet("hc_prefs", { autoMute: false, sounds: true, micId: "", camId: "" });
  const savePrefs = p => lsSet("hc_prefs", p);

  /* ======================= Supabase data layer ======================= */
  const hashColor = seed => {
    let h = 0; for (const cc of String(seed || "")) h = (h * 31 + cc.charCodeAt(0)) | 0;
    return COLORS[Math.abs(h) % COLORS.length];
  };
  const mapServerRow = r => ({
    id: r.id, name: r.name || "Unnamed", owner: r.owner_id, invite: r.invite_code,
    color: hashColor(r.invite_code || r.id), members: [], call: [], chat: [], roster: {},
    createdAt: Date.parse(r.created_at || 0) || 0
  });

  /* Server + profile mirror: servers we belong to, plus every member's (name,color). */
  async function refreshData() {
    if (!supabaseClient || !S.user) return;
    try {
      const { data: mems } = await supabaseClient.from("server_members").select("server_id,user_id,user_name,user_color");
      if (!mems) return;
      const profiles = {};
      mems.forEach(m => { if (m.user_id) profiles[m.user_id] = ensureProfile(m.user_id, m.user_name, m.user_color); });
      if (S.user) profiles[S.user.id] = ensureProfile(S.user.id, S.user.name, S.user.color);
      const ids = [...new Set(mems.map(m => m.server_id))];
      const servers = {};
      if (ids.length) {
        const { data: sr } = await supabaseClient.from("servers").select("*").in("id", ids);
        (sr || []).forEach(r => {
          servers[r.id] = mapServerRow(r);
          servers[r.id].members = mems.filter(m => m.server_id === r.id).map(m => m.user_id);
        });
      }
      DB.servers = servers;
      DB.profiles = profiles;
      const g = servers[S.activeGuildId];
      if (g) await loadServerData(g);
      return g ? Object.values(servers) : Object.values(servers);
    } catch (e) { console.warn("refreshData failed", e); }
  }

  async function loadServerData(g) {
    if (!supabaseClient) return;
    await loadMembers(g);
    await Promise.all([loadChat(g), loadSoundboard(g)]);
    await loadPresence(g);
  }

  async function loadMembers(g) {
    try {
      const { data } = await supabaseClient.from("server_members").select("user_id,user_name,user_color").eq("server_id", g.id);
      g.members = (data || []).map(r => r.user_id).filter(Boolean);
      (g.members || []).forEach(id => ensureProfile(id, null, null));
    } catch (e) { console.warn("loadMembers failed", e); }
  }

  async function loadChat(g) {
    try {
      const { data } = await supabaseClient.from("messages").select("*").eq("server_id", g.id).order("created_at", { ascending: true }).limit(300);
      g.chat = (data || []).map(m => mapMsgRow(m)).filter(Boolean);
      (g.chat || []).forEach(m => { if (m.authorId) ensureProfile(m.authorId, m.authorName, m.authorColor); });
    } catch (e) { console.warn("loadChat failed", e); }
  }
  const mapMsgRow = r => r ? {
    id: r.id, authorId: r.user_id, authorName: r.user_name, authorColor: r.user_color,
    text: r.content, at: Date.parse(r.created_at) || Date.now()
  } : null;

  /* Call presence: one row per server, active_users jsonb (roster + "_music"). */
  const ROSTER_MIRROR = {};
  async function loadPresence(g) {
    try {
      const { data } = await supabaseClient.from("call_presence").select("server_id,active_users").eq("server_id", g.id).maybeSingle();
      applyActiveUsers(g, data ? data.active_users : {});
    } catch (e) { console.warn("loadPresence failed", e); }
  }

  function applyActiveUsers(g, obj, origin) {
    obj = obj && typeof obj === "object" ? obj : {};
    ROSTER_MIRROR[g.id] = obj;
    const prevCall = g.call || [];
    const prevRoster = g.roster || {};
    const roster = {};
    let music = null;
    Object.keys(obj).forEach(k => {
      const v = obj[k];
      if (k === "_music" && v && typeof v === "object") { music = v; return; }
      if (!v || typeof v !== "object") return;
      roster[k] = v;
      ensureProfile(k, v.name, v.color);
    });
    // "active_users" is a read-modify-write JSON blob, so two people writing
    // presence at the same moment can briefly clobber each other. Never drop
    // ourselves, or a peer we hold an open WebRTC connection to, on a realtime
    // update: that is what made people look kicked out of the call.
    if (origin === "rt" && S.call && S.call.guildId === g.id) {
      if (S.user && !roster[S.user.id]) {
        const mine = users()[S.user.id] || { name: S.user.name, color: S.user.color };
        roster[S.user.id] = {
          name: mine.name || S.user.name, color: mine.color || S.user.color,
          mic: !!S.call.mic, cam: !!S.call.cam, share: !!S.call.share, joinedAt: S.call.joinAt
        };
        ensureProfile(S.user.id, roster[S.user.id].name, roster[S.user.id].color);
      }
      Object.keys(S.call.peers || {}).forEach(uid => {
        const mc = S.call.peers[uid];
        if (roster[uid] || !mc || !mc.open || uid === S.user.id) return;
        const p = users()[uid] || {};
        roster[uid] = { name: p.name || "", color: p.color || "", mic: false, cam: false, share: false, joinedAt: Date.now() };
        ensureProfile(uid, p.name, p.color);
      });
    }
    g.call = Object.keys(roster);
    g.roster = roster;
    // Anyone who is no longer in the call loses their green speaking ring too.
    Object.keys(talkState).forEach(uid => { if (!roster[uid]) clearTalkState(uid); });
    if (music && music.queue) S.callMusic = music;
    if (origin === "rt" && S.call && S.call.guildId === g.id) {
      g.call.filter(id => !prevCall.includes(id) && id !== S.user.id).forEach(id => {
        toast(displayName(id, roster[id] && roster[id].name) + " joined the call.", "info");
      });
      prevCall.filter(id => !g.call.includes(id) && id !== S.user.id).forEach(id => {
        toast(displayName(id, prevRoster[id] && prevRoster[id].name) + " left the call.", "info");
      });
      g.call.filter(id => !!((roster[id] || {}).share) && !(prevRoster[id] || {}).share).forEach(id => {
        toast(displayName(id, roster[id] && roster[id].name) + " started sharing their screen.", "info");
      });
      prevCall.filter(id => !((roster[id] || {}).share) && !!((prevRoster[id] || {}).share)).forEach(id => {
        toast(displayName(id, prevRoster[id] && prevRoster[id].name) + " stopped sharing their screen.", "info");
      });
      // Show "X is presenting" as soon as presence says so, even before the
      // screen media connection has finished negotiating.
      if (S.call.sharePending) {
        Object.keys(roster).forEach(id => {
          if (id === S.user.id) return;
          if (roster[id].share && !(prevRoster[id] || {}).share) S.call.sharePending[id] = true;
          if (!roster[id].share) delete S.call.sharePending[id];
        });
      }
    }
    if (origin !== "local" && S.call && S.call.guildId === g.id) {
      if (music && music.queue && SP.on) applySpotifySync(music);
      // Dial users we aren't connected to yet (lower-id initiates to avoid double-dials).
      if (peerOpen && S.call && S.call.guildId === g.id) {
        g.call.forEach(id => { if (id !== S.user.id && S.user.id < id) callUser(id); });
        if (S.call.share) ensureShareMesh();     // late joiners get the screen share too
      }
      if (byId("call-view")) {
        const added = g.call.some(id => !prevCall.includes(id));
        const removed = prevCall.some(id => !g.call.includes(id));
        const shareFlip = g.call.some(id => !!((prevRoster[id] || {}).share) !== !!((roster[id] || {}).share));
        if (added || removed || shareFlip) { updateStage(); updateCtl(); }
        else { g.call.forEach(id => updateTileFor(id)); updateCtl(); }
      }
    }
  }

  function broadcastPayload(message) {
    return message && message.payload && typeof message.payload === "object" ? message.payload : (message || {});
  }

  async function loadSoundboard(g) {
    if (!supabaseClient) return;
    try {
      const { data } = await supabaseClient.from("soundboard").select("*").order("id", { ascending: false });
      DB.soundboards[g.id] = (data || []).filter(r => r.server_id === g.id).map(r => ({
        id: r.id, addedBy: r.user_id, name: r.name, emoji: r.emoji, dataUrl: r.data_url,
        at: Date.parse(r.created_at) || 0, server_id: r.server_id
      }));
    } catch (e) { console.warn("loadSoundboard failed", e); }
  }

  /* Presence writes are read-merge-write and serialized so concurrent toggles
     from in-call users don't clobber each other. */
  let presenceQueue = Promise.resolve();
  function writePresence(gid, patch) {
    if (!supabaseClient || !gid) return;
    presenceQueue = presenceQueue.then(async () => {
      // Read-modify-write races with other clients, so retry once instead of
      // silently losing our own roster entry.
      for (let attempt = 0; attempt < 2; attempt++) {
        try {
          const { data } = await supabaseClient.from("call_presence").select("server_id,active_users").eq("server_id", gid).maybeSingle();
          if (data && data.active_users && typeof data.active_users !== "object") return;
          const obj = Object.assign({}, data && data.active_users || {});
          Object.keys(patch).forEach(k => { if (patch[k] === null) delete obj[k]; else obj[k] = patch[k]; });
          if (data) await supabaseClient.from("call_presence").update({ active_users: obj }).eq("server_id", gid);
          else await supabaseClient.from("call_presence").insert({ server_id: gid, active_users: obj });
          return;
        } catch (e) {
          if (attempt === 1) console.warn("presence write failed", e);
        }
      }
    });
  }

  /* Instant (broadcast) mic/cam/share state propagation — mirrors pushPresence
     without waiting for the DB roundtrip. DB presence still records the state
     for anyone who joins later. */
  function sendState() {
    const c = S.call;
    if (!c || !S.user || !supabaseClient) return;
    const ch = getChannel(c.guildId);
    if (!ch) return;
    try {
      ch.send({ type: "broadcast", event: "state", payload: {
        from: S.user.id, mic: !!c.mic, cam: !!c.cam, share: !!c.share,
        name: S.user.name, color: S.user.color
      } });
    } catch (e) {}
  }
  /* In-place tile refresh — patches a single tile's mic badge / camera state
     without recreating the DOM (keeps <audio> streams playing seamlessly). */
  function updateTileFor(uid) {
    const c = S.call; if (!c) return;
    const g = guilds()[c.guildId]; if (!g) return;
    const tile = tileEl(uid);
    if (!tile) return;
    const u = users()[uid]; if (!u) return;
    const self = uid === S.user.id;
    const r = g.roster[uid] || {};
    const remoteSt = c.remote[uid];
    const camOn = self ? c.cam : !!r.cam;
    const micOn = self ? c.mic : !!r.mic;
    const hasVid = self ? !!(c.cam && c.stream && c.stream.getVideoTracks().length) : !!(camOn && remoteSt && remoteSt.video);
    const tag = $(".tile-tag", tile);
    if (tag) {
      const mb = $(".mic-badge", tag);
      if (mb) { mb.className = "mic-badge " + (micOn ? "on" : "off"); mb.innerHTML = ic(micOn ? "mic" : "micOff", 13); }
      const nm = $(".tile-name", tag);
      if (nm) nm.textContent = u.name + (self ? "  (you)" : "");
    }
    const av = $(".tile-avatar", tile);
    if (av) av.style.display = (hasVid ? "none" : "");
    const co = $(".tile-camoff", tile);
    if (co) co.style.display = (camOn || self || hasVid) ? "none" : "";
    const vid = byId(self ? "vm-self" : "vm-" + uid);
    if (vid && !self && hasVid && remoteSt) {
      if (vid.srcObject !== remoteSt.stream) vid.srcObject = remoteSt.stream;
      playMedia(vid);
      vid.hidden = false;
    } else if (vid && !self) {
      vid.hidden = true;
    }
    attachMedia();
  }
  function onStateBroadcast(p) {
    p = broadcastPayload(p);
    if (!S.call || !p || !p.from || p.from === S.user.id) return;
    const g = guilds()[S.call.guildId];
    if (!g) return;
    const r = g.roster[p.from];
    if (!r) return;
    const prevShare = !!r.share;
    r.mic = !!p.mic;
    r.cam = !!p.cam;
    r.share = !!p.share;
    if (p.name || p.color) ensureProfile(p.from, p.name, p.color);
    // "X is presenting" needs to appear instantly (the DB presence event lags).
    if (S.call.sharePending) {
      if (r.share && !prevShare) S.call.sharePending[p.from] = true;
      if (!r.share) delete S.call.sharePending[p.from];
    }
    if (byId("call-view")) {
      if (r.share !== prevShare) updateStage();
      else updateTileFor(p.from);
    } else { appView(); }
  }

  function pushPresence() {

    const g = guild(); if (!g || !r || r.server_id !== g.id) return;

    const chat = g.chat || (g.chat = []);
    if (chat.some(x => x.id === m.id)) return;
    // A locally optimistically-appended message has a temp id — swap it with the
    // real database id so the Realtime echo never renders a second copy.
    const tmpIdx = chat.findIndex(x => x.pending && x.authorId === m.authorId && x.text === m.text && Math.abs((x.at || 0) - (m.at || 0)) < 7000);
    if (tmpIdx !== -1) {

      if (m.authorName) tmp.authorName = m.authorName;
      if (m.authorColor) tmp.authorColor = m.authorColor;

  const playerLogs = [];
  const fmtTime = (ms) => {
    const d = new Date(ms);

  };

    return u.length > 160 ? core.slice(0, 120) + "…" : u;
  };
  const fmtLogArg = (x) => x instanceof Error ? (x.stack || x.message) : (x && typeof x === "object" ? (() => { try { return JSON.stringify(x); } catch (_) { return String(x); } })() : String(x));
  function logPlayer(level, msg) {
    const entry = { t: Date.now(), level: String(level || "info"), msg: String(msg || "") };
    playerLogs.push(entry);
    if (playerLogs.length > 300) playerLogs.shift();
    return entry;
  }
  if (!window.__HC_LOG_PATCHED__) {
    window.__HC_LOG_PATCHED__ = true;
    const oW = console.warn.bind(console);
    const oE = console.error.bind(console);
    console.warn = function (...a) { logPlayer("warn", a.map(fmtLogArg).join(" ")); return oW.apply(console, a); };
    console.error = function (...a) { logPlayer("error", a.map(fmtLogArg).join(" ")); return oE.apply(console, a); };
    if (typeof window.addEventListener === "function") {
      window.addEventListener("error", (e) => logPlayer("error", ("window.onerror: " + (e && e.message ? e.message : String(e))) + (e && e.filename ? " @" + e.filename + (e.lineno ? ":" + e.lineno : "") : "")));
      window.addEventListener("unhandledrejection", (e) => {

  }

  /* ======================= audio chime ======================= */
  function playChime() {
    if (!prefs().sounds) return;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const ctx = new Ctx();
      const tone = (f, t, d) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = f; o.type = "sine";
        o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.16, ctx.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + d);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + d + 0.05);
      };
      tone(523, 0, 0.35); tone(659, 0.09, 0.35); tone(784, 0.18, 0.5);
    } catch (e) { /* ignore */ }
  }

    // Force resolvers to be considered "down" on first load so every track
    // plays instantly via YouTube IFrame. Re-enable probing with the
    // "↻ Retry resolvers now" button in the Playback Logs panel.
    if (localStorage.getItem(RESOLVER_CACHE_KEY) === null) markResolverDown();
    if (!supabaseClient) { renderConfigError(); return; }
    document.addEventListener("keydown", e => { if (e.key === "Escape" && S.modalOpen) closeModal(); });
    document.addEventListener("click", e => {
      const m = $(".dropdown:not(.hidden)");
      if (m && !m.contains(e.target)) m.classList.add("hidden");
    });
    window.addEventListener("pagehide", e => cleanupOnUnload(e));
    window.addEventListener("beforeunload", () => cleanupOnUnload({ persisted: false }));
    // Backgrounding a tab/app is not leaving the call: re-assert presence and
    // wake frozen media up again as soon as the page is visible/focused.
    document.addEventListener("visibilitychange", () => { if (!document.hidden) onPageResumed(); });
    window.addEventListener("focus", () => onPageResumed());
    // Media playback and talking-ring analysers may be blocked until the page
    // has a user gesture — every gesture is a chance to start them.
    ["click", "pointerdown", "keydown", "touchstart"].forEach(ev =>
      document.addEventListener(ev, () => { resumeTalkContexts(); kickMediaPlayback(); }, true));
    supabaseClient.auth.getSession().then(({ data }) => {
      if (data.session && data.session.user) {
        SESSION_TOKEN = data.session.access_token || null;
        refreshAndGo(data.session.user);
      } else renderAuth();
    });
    supabaseClient.auth.onAuthStateChange((evt, session) => {
      if (evt === "SIGNED_IN" && session) {
        SESSION_TOKEN = session.access_token || null;
        refreshAndGo(session.user);
      } else if (evt === "SIGNED_OUT") {
        SESSION_TOKEN = null;
        if (!S.user) renderAuth();
      }
    });
  }

  async function refreshAndGo(remoteUser) {
    if (!supabaseClient) return renderAuth();
    if (!remoteUser) {
      const { data: ud } = await supabaseClient.auth.getUser();
      remoteUser = ud.user;
    }
    if (!remoteUser) return renderAuth();
    const meta = remoteUser.user_metadata || {};
    const uid = remoteUser.id;
    const email = remoteUser.email || "";
    const clean = (meta && (meta.display_name || meta.name)) || "";
    const name = (clean && clean.trim()) || (email && email.split("@")[0].trim()) || fallbackName(uid);
    const color = meta.color || COLORS[0];
    S.user = ensureProfile(uid, name, color);
    supabaseClient.auth.getSession().then(({ data }) => { if (data && data.session) SESSION_TOKEN = data.session.access_token; });
    await refreshData();
    const p = DB.profiles[uid];
    if (p && p.name && !isPlaceholder(p.name)) S.user.name = p.name;
    if (p && p.color) S.user.color = p.color;
    goHome();
  }

  function authError(msg) {
    const el = byId("auth-err");
    el.textContent = msg;
    el.classList.add("show");

  async function doSignup(color) {
    const name = (byId("au-name").value || "").trim();
    const email = (byId("au-email").value || "").trim();
    const pass = byId("au-pass").value || "";
    if (name.length < 2) return authError("Please pick a display name (2+ characters).");
    if (!/^\S+@\S+\.\S+$/.test(email)) return authError("Enter a valid email address.");
    if (pass.length < 6) return authError("Password needs at least 6 characters.");
    const { data, error } = await supabaseClient.auth.signUp({
      email, password: pass,
      options: { data: { display_name: name, color } }
    });
    if (error) return authError(error.message);
    if (data && data.session) {
      S.user = { id: data.session.user.id, name, color };
      await createStarterGuild();
      goHome();
      toast("Welcome to HiveCall, " + name + "!", "ok");
    } else {
      // Email confirmation enabled in Supabase — ask the user to confirm.
      byId("auth-form").innerHTML =
        '<h2>Check your email</h2>' +
        '<p class="sub">We sent a confirmation link to <b>' + esc(email) + '</b>. Confirm it, then sign in.</p>' +
        '<button class="btn btn-primary" style="width:100%;" id="auth-confirm-ok">OK</button>';
      byId("auth-confirm-ok").addEventListener("click", () => renderAuth("login"));
    }
  }

  async function doLogin() {
    const email = (byId("au-email").value || "").trim();
    const pass = byId("au-pass").value || "";
    if (!email || !pass) return authError("Enter your email and password.");
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
    if (error) return authError(error.message);
    // onAuthStateChange(SIGNED_IN) → refreshAndGo → goHome
    toast("Signed in.", "ok");
  }

  async function signOut() {
    if (S.call) leaveCall();
    if (supabaseClient) { try { await supabaseClient.auth.signOut(); } catch (e) {} }
    S.user = null; S.activeGuildId = null;
    closeRealtime();
    DB = { servers: {}, profiles: {}, soundboards: {} };
    renderAuth("login");
    toast("Signed out.", "info");
  }

  /* ======================= guilds (Supabase servers) ======================= */
  const goodCode = () => {
    const a = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let s = "";
    for (let i = 0; i < 6; i++) s += a[rand(0, a.length - 1)];
    return s;
  };
  async function uniqueInviteCode() {
    for (let tries = 0; tries < 25; tries++) {
      const code = goodCode();
      const { data } = await supabaseClient.from("servers").select("id").eq("invite_code", code).maybeSingle();
      if (!data) return code;
    }
    return goodCode();
  }

  async function createGuild(name) {
    const invite = await uniqueInviteCode();
    const color = hashColor(invite);
    const { data, error } = await supabaseClient.from("servers").insert({
      name: name || randServerName(), owner_id: S.user.id, invite_code: invite
    }).select().single();
    if (error || !data) { toast("Could not create the server (" + (error ? error.message : "no row") + ").", "err"); return null; }
    // Membership (carries name/color so member lists work everywhere).
    await upsertMember(data.id);
    const g = mapServerRow(data);
    g.members = [S.user.id];
    DB.servers[g.id] = g;
    if (S.user && !DB.profiles[S.user.id]) DB.profiles[S.user.id] = { id: S.user.id, name: S.user.name, color: S.user.color };
    return g;
  }
  async function upsertMember(serverId) {
    const me = S.user; if (!me || !supabaseClient) return;
    await supabaseClient.from("server_members").upsert(
      { server_id: serverId, user_id: me.id },
      { onConflict: "server_id,user_id" }
    );
  }

  async function createStarterGuild() {
    const g = await createGuild(null);
    if (!g) return;
    S.activeGuildId = g.id;
    S.activeChannel = "voice";
  }

  async function deleteGuild(id) {
    const g = guilds()[id];
    if (!g || g.owner !== S.user.id) return;
    if (S.call && S.call.guildId === id) leaveCall();
    if (supabaseClient) {
      const tid = g.id;
      await supabaseClient.from("messages").delete().eq("server_id", tid);
      await supabaseClient.from("call_presence").delete().eq("server_id", tid);
      await supabaseClient.from("soundboard").delete().eq("server_id", tid);
      await supabaseClient.from("server_members").delete().eq("server_id", tid);
      await supabaseClient.from("servers").delete().eq("id", tid).eq("owner_id", S.user.id);
    }
    closeRealtime();
    delete DB.servers[id];
    if (S.activeGuildId === id) S.activeGuildId = null;
    closeModal();
    goHome();
    toast('"' + g.name + '" was deleted.', "info");
  }

  async function joinGuildByCode(code) {
    code = (code || "").toUpperCase().trim();
    if (!code) return toast("Enter the 6-character invite code.", "err");
    if (code.length !== 6) return toast("Invite codes are 6 characters.", "err");
    const { data, error } = await supabaseClient.from("servers").select("*").eq("invite_code", code).maybeSingle();
    if (error || !data) return toast("No server found for code " + code + ".", "err");
    await upsertMember(data.id);
    DB.profiles[S.user.id] = { id: S.user.id, name: S.user.name, color: S.user.color };
    toast("Joined " + data.name + "!", "ok");
    S.activeGuildId = data.id;
    S.activeChannel = "voice";
    closeModal();
    goHome();
  }

  function chatRowHTML(m) {
    if (m.system) return '<div class="msg system"><span class="sicon">' + ic("info", 15) + '</span><div class="m-text">' + esc(m.text) + ' <span class="m-time">' + time12(m.at) + "</span></div></div>";

    return '<div class="msg"><div class="avatar" style="width:38px;height:38px;background:' + color + '">' + esc(initials(name)) + '</div>' +
      '<div class="m-body"><div class="m-meta"><span class="m-name" style="color:' + color + '">' + esc(name) + '</span><span class="m-time">' + time12(m.at) + "</span></div>" +
      '<div class="m-text">' + esc(m.text) + "</div></div></div>";
  }
  function chatHTML(g) {
    const msgs = (g.chat || []).map(m => chatRowHTML(m)).join("");
    return '<div class="chat-head">' + ic("hash", 18) + "<span>general</span></div>" +
      '<div class="chat-msgs" id="chat-msgs">' + (msgs || '<p class="ill-hint">No messages yet. Say hi!</p>') + "</div>" +
      '<div class="typing" id="typing" style="display:none;color:var(--tx-3);font-size:12px;line-height:1;padding:7px 4px 9px;"></div>' +
      '<div class="chat-comp"><div class="inner"><input id="chat-in" placeholder="Message #general" autocomplete="off"><button class="send" id="chat-send">' + ic("send", 18) + "</button></div></div>";
  }
  function wireChat(g) {
    const sc = byId("chat-msgs"); if (sc) sc.scrollTop = sc.scrollHeight;
    const input = byId("chat-in");
    input.focus();
    const emitTyping = stopped => {
      const ch = getChannel(g.id);
      if (!ch) return;
      try { ch.send({ type: "broadcast", event: "typing", payload: { from: S.user.id, guildId: g.id, stopped: !!stopped } }); } catch (e) {}
    };
    let typT = null;
    input.addEventListener("input", () => {
      if (!input.value.trim()) { emitTyping(true); return; }
      clearTimeout(typT);
      typT = setTimeout(() => typLastSent = 0, 2200);
      if (!typLastSent || Date.now() - typLastSent > 2500) { typLastSent = Date.now(); emitTyping(false); }
    });
    input.addEventListener("blur", () => { clearTimeout(typT); emitTyping(true); });
    const send = async () => {
      const text = input.value.trim();
      if (!text || !supabaseClient) return;
      clearTimeout(typT); typLastSent = 0; emitTyping(true);
      const me = S.user;
      const localId = "m_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);

          created_at: new Date().toISOString()
        }).select().single();

  /* ---------- typing indicators (broadcast "typing" + 2.5s throttle, 4s expiry) ---------- */

  function sweepTypers() {
