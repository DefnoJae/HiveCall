<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HiveCall</title>
  
  <!-- Supabase and PeerJS CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  
  <!-- Your app script -->
  <script src="app.js" defer></script>
  
  <style>
    /* Add your CSS styles here - or link to a CSS file */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #0a0a0f; 
      color: #e0e0e0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    #app { width: 100vw; height: 100vh; }
    #root-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 1000; }
    #toasts { position: fixed; bottom: 20px; right: 20px; z-index: 2000; }
    /* Add more styles as needed */
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="root-modal"></div>
  <div id="toasts"></div>
</body>
</html>
